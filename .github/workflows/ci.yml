name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          export VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://baapi.swiftgd.com/api}"
          echo "Building with VITE_API_BASE_URL=$VITE_API_BASE_URL"
          npm run build

  backend:
    name: Backend smoke check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify modules load
        run: |
          node -e "
            require('./src/services/auth.service');
            require('./src/services/ledger.service');
            require('./src/services/sales.service');
            require('./src/services/purchase.service');
            console.log('Backend modules OK');
          "
